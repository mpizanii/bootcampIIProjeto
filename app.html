<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Receitas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <h1>Caderno de Receitas</h1>
    <p class="subtitulo">Digite um prato ou ingrediente e veja detalhes sobre ele!</p>
  </header>

  <main>
    <form id="form-busca" class="busca" autocomplete="off">
      <label for="campo-prato">Nome do prato</label>
      <div class="linha-busca">
        <input
          type="text"
          id="campo-prato"
          name="prato"
          placeholder="ex: chicken, arrabiata, curry…"
          required
        >
        <button type="submit" id="botao-buscar">Buscar</button>
        <button type="button" id="botao-aleatorio" title="Sugerir um prato ao acaso">Aleatório</button>
      </div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>

    <div class="conteudo">
      <section id="lista-resultados" class="lista-resultados" aria-label="Resultados da busca"></section>
      <section id="detalhe" class="detalhe" aria-live="polite">
      </section>
    </div>

    <section class="favoritos" aria-labelledby="titulo-favoritos">
      <h2 id="titulo-favoritos">Minhas receitas favoritas</h2>
      <p id="status-favoritos" class="status" role="status" aria-live="polite"></p>
      <div id="lista-favoritos" class="lista-favoritos"></div>
    </section>
  </main>

  <footer class="rodape">
    <p>Dados e imagens: <a href="https://www.themealdb.com/" target="_blank" rel="noopener">TheMealDB API</a></p>
    <button type="button" id="botao-sair" class="botao-link">Sair da conta</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
