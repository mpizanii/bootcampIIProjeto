<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Caderno de Receitas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Caderno de Receitas</h1>
    <p class="subtitulo">Entre para pesquisar e organizar suas receitas.</p>
  </header>
  <main>
    <section class="autenticacao" aria-labelledby="titulo-autenticacao">
      <h2 id="titulo-autenticacao">Entre no seu caderno</h2>
      <p id="descricao-autenticacao" class="auth-descricao">Acesse sua conta ou crie um cadastro para continuar.</p>
      <form id="form-auth" class="form-auth">
        <label for="auth-email">E-mail</label>
        <input type="email" id="auth-email" autocomplete="email" required>
        <label for="auth-senha">Senha</label>
        <input type="password" id="auth-senha" autocomplete="current-password" minlength="6" required>
        <button type="submit" id="botao-auth">Entrar</button>
        <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
      </form>
      <button type="button" id="botao-alternar-auth" class="botao-link">Ainda não tenho uma conta</button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
